name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Backend tests ─────────────────────────────────────────────────
  backend-test:
    name: Backend – Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run tests
        run: pytest backend/test_routes.py -v

  # ── Job 2: Frontend tests ─────────────────────────────────────────────────
  frontend-test:
    name: Frontend – Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: CI=true npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # Vercel deploys the frontend automatically on push and runs its own build
  # check — if npm run build fails, Vercel won't promote it to production.
  # Render deploys the backend automatically once these CI jobs pass
  # (configured via "After CI Checks Pass" in Render settings).
